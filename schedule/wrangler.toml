name = "quantt-calendar"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# Keep variables set in the dashboard (MEMBER_LOGIN, EMAIL_FROM, ...) on deploy.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "SCHEDULE_KV"

# Events, attendance and reminder settings. No database_id: wrangler creates it in the Worker's account on the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "quantt-calendar-events"

# Reminder emails: checks every 15 minutes for events with a reminder due.
[triggers]
crons = ["*/15 * * * *"]

# Member sign-in: the shared member directory (members/ in this repo, Worker quantt-members) says who a Cloudflare Access email
# belongs to. Deploy quantt-members before this binding. Sign-in is on only when the variable MEMBER_LOGIN is "on".
[[services]]
binding = "MEMBERS"
service = "quantt-members"
entrypoint = "Directory"
