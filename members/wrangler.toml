name = "quantt-members"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# ACCESS_TEAM, ACCESS_AUDS and ADMIN_EMAILS are set in the dashboard; keep them on deploy.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# The member directory. No id: wrangler creates it in the Worker's account on the first deploy.
[[kv_namespaces]]
binding = "MEMBERS_KV"
